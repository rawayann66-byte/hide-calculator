
name: Build HIDE CALCULATOR APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract Project
        run: |
          unzip HIDE_CALCULATOR_ANDROID_READY.zip
          cd hidecalc_project
          npm install
          npm run build
          npm install --no-save @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HIDE-CALCULATOR-APK
          path: hidecalc_project/android/app/build/outputs/apk/debug/app-debug.apk
